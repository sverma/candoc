name: candock
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: candock
      POSTGRES_DB: candock
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U candock -d candock"]
      interval: 5s
      timeout: 5s
      retries: 12
    mem_limit: 512m
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_URL: ${APP_URL:?Set HTTPS APP_URL in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      DATABASE_URL: postgresql+psycopg://candock:${POSTGRES_PASSWORD}@db:5432/candock
      UPLOAD_DIR: /data/resumes
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-6-luna}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes:
      - uploads:/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 768m
    logging: *logging
  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    ports:
      - 127.0.0.1:8280:8080
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m
      - /var/run:size=2m
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    logging: *logging
volumes:
  database:
  uploads:
