# Retain the bootstrap certificate's webroot challenge for automatic renewal.
server {
    listen 80;
    listen [::]:80;
    server_name candock.45.32.222.239.sslip.io;
    location /.well-known/acme-challenge/ { root /var/www/candock-acme; }
    location / { return 301 https://candoc.org$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name candock.45.32.222.239.sslip.io;
    ssl_certificate /etc/letsencrypt/live/candock.45.32.222.239.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/candock.45.32.222.239.sslip.io/privkey.pem;
    return 301 https://candoc.org$request_uri;
}
