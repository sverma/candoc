server {
    listen 80;
    listen [::]:80;
    server_name candoc.org www.candoc.org;
    location /.well-known/acme-challenge/ { root /var/www/candock-acme; }
    location / { return 301 https://candoc.org$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name candoc.org;
    ssl_certificate /etc/letsencrypt/live/candoc.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/candoc.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 6m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    access_log /var/log/nginx/candock-access.log;
    error_log /var/log/nginx/candock-error.log;
    location / {
        proxy_pass http://127.0.0.1:8280;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 100s;
    }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.candoc.org;
    ssl_certificate /etc/letsencrypt/live/candoc.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/candoc.org/privkey.pem;
    return 301 https://candoc.org$request_uri;
}
